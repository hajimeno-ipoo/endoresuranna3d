<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>拡大テスト A（現行レシピ）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { touch-action: none; font-family: sans-serif; background:#2b2440; color:#fff; overflow:hidden;
       -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
#info { padding:14px 16px 8px; }
#info h1 { font-size:19px; margin-bottom:6px; }
#info p { font-size:14px; line-height:1.5; opacity:.9; }
#scalebox { display:flex; gap:10px; padding:8px 16px; }
.sc { flex:1; background:#17122b; border:2px solid #574a8a; border-radius:12px; padding:8px 0; text-align:center; }
.sc .lab { font-size:12px; opacity:.8; }
.sc .val { font-size:30px; font-weight:700; font-variant-numeric: tabular-nums; }
#maxbox.zoomed { border-color:#ff5470; background:#4a1220; }
#stage { position:relative; margin:10px 16px; height:52vh; background:linear-gradient(#584a8f,#3a2f63);
         border-radius:16px; overflow:hidden; }
#dpad { position:absolute; left:18px; bottom:18px; width:184px; height:184px; touch-action:none; }
#dpad svg { display:block; }
#count { position:absolute; right:16px; top:12px; font-size:15px; background:rgba(0,0,0,.35);
         padding:4px 10px; border-radius:999px; }
#log { padding:6px 16px; font-size:12px; opacity:.75; min-height:18px; word-break:break-all; }
#nav { padding:8px 16px; }
#nav a { color:#ffd21f; font-size:15px; }
button#reset { margin:0 16px; font-size:15px; padding:8px 14px; border-radius:10px; border:0; background:#ffd21f; color:#222; font-weight:700; }
</style>
</head>
<body>
<div id="info"><h1>拡大テスト A（現行レシピ）</h1><p>下の十字キーを、ゲームの時と同じように速く連打してください（同じ方向でも、左右交互でも）。拡大すると「最大の拡大率」が 1.00 より大きくなります。</p></div>
<div id="scalebox">
  <div class="sc"><div class="lab">現在の拡大率</div><div class="val" id="cur">1.00</div></div>
  <div class="sc" id="maxbox"><div class="lab">最大の拡大率</div><div class="val" id="max">1.00</div></div>
</div>
<button id="reset">最大をリセット（拡大を戻す）</button>
<div id="stage">
  <div id="count">タップ 0 回</div>
  <div id="dpad">
<svg width="184" height="184" viewBox="0 0 184 184" >
  <rect x="62" y="6" width="60" height="172" rx="10" fill="rgba(255,214,235,.55)"/>
  <rect x="6" y="62" width="172" height="60" rx="10" fill="rgba(255,214,235,.55)"/>
  <rect id="arm-up" x="62" y="6" width="60" height="86" fill="rgba(0,0,0,0)"/>
  <rect id="arm-down" x="62" y="92" width="60" height="86" fill="rgba(0,0,0,0)"/>
  <rect id="arm-left" x="6" y="62" width="86" height="60" fill="rgba(0,0,0,0)"/>
  <rect id="arm-right" x="92" y="62" width="86" height="60" fill="rgba(0,0,0,0)"/>
  <path d="M92 22 L106 44 L78 44 Z" fill="#333"/>
  <path d="M92 162 L106 140 L78 140 Z" fill="#333"/>
  <path d="M22 92 L44 78 L44 106 Z" fill="#333"/>
  <path d="M162 92 L140 78 L140 106 Z" fill="#333"/>
</svg></div>
</div>
<div id="log">A は今のゲームと全く同じ拡大防止です。</div>
<div id="nav"></div>
<script>

/* Game's current recipe: gesturestart block + touchstart claim inside #stage */
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('touchstart', function (e) {
  var t = e.target;
  if (t && t.closest && t.closest('#stage')) e.preventDefault();
}, { passive: false });
document.getElementById('nav').innerHTML = '<a href="zoomtest-b.html">→ B（強化版）へ</a>';


const pad = document.getElementById('dpad');
const arms = { up: document.getElementById('arm-up'), down: document.getElementById('arm-down'),
               left: document.getElementById('arm-left'), right: document.getElementById('arm-right') };
let taps = 0;
pad.addEventListener('pointerdown', (e) => {
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  const a = arms[dir]; if (a) { a.setAttribute('fill', '#ffd21f'); setTimeout(() => a.setAttribute('fill', 'rgba(0,0,0,0)'), 160); }
  taps++; document.getElementById('count').textContent = 'タップ ' + taps + ' 回';
});
const vv = window.visualViewport;
let maxScale = 1;
function upd() {
  const s = vv ? vv.scale : 1;
  if (s > maxScale) maxScale = s;
  document.getElementById('cur').textContent = s.toFixed(2);
  document.getElementById('max').textContent = maxScale.toFixed(2);
  document.getElementById('maxbox').classList.toggle('zoomed', maxScale > 1.05);
}
if (vv) vv.addEventListener('resize', upd);
setInterval(upd, 200); upd();
document.getElementById('reset').addEventListener('click', () => {
  maxScale = 1;
  const m = document.querySelector('meta[name="viewport"]');
  m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  upd();
});

</script>
</body>
</html>
